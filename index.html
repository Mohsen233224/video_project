<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎤 إدارة القستات PRO MAX</title>
<style>
/* ---------- Reset ---------- */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
}

/* ---------- Body ---------- */
body {
  background: radial-gradient(circle at top, #0f2027, #000);
  color: #fff;
  display: flex;
  justify-content: center;
  padding: 20px;
  min-height: 100vh;
}

/* ---------- Container ---------- */
.container {
  width: 95%;
  max-width: 900px;
  text-align: center;
  position: relative;
}

/* ---------- المضيف ---------- */
.host {
  display: flex;
  align-items: center;
  gap: 15px;
  justify-content: center;
  margin-bottom: 20px;
}
.host img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 3px solid #00f2ea;
  box-shadow: 0 0 20px #00f2ea;
}
.host-name {
  font-weight: bold;
  font-size: 1.2rem;
  color: #00f2ea;
}

/* ---------- القست الحالي ---------- */
.current-box-pro {
  padding: 20px;
  border-radius: 25px;
  background: #0b0b0b;
  margin-bottom: 20px;
  overflow: hidden;
  box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
  position: relative;
}
.current-box-pro::before {
  content: "";
  position: absolute;
  inset: 0;
  padding: 3px;
  border-radius: 25px;
  background: linear-gradient(45deg, #00f2ea, #ff00c8, #00ff88, #ffaa00);
  background-size: 300% 300%;
  animation: borderMove 6s linear infinite;
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
}
@keyframes borderMove {
  0% { background-position: 0% }
  100% { background-position: 300% }
}

/* ---------- الوقت ---------- */
.timer {
  font-size: 1.3rem;
  color: #00ff88;
  margin-top: 15px;
}

/* ---------- ضيوف القست ---------- */
.guests-pro {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 25px;
}
.main-guest {
  text-align: center;
  animation: pulse 2s infinite;
}
.main-guest img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 5px solid #ffaa00;
  box-shadow: 0 0 35px #ffaa00;
}
.main-guest div {
  margin-top: 12px;
  color: #ffaa00;
  font-weight: bold;
  font-size: 1.1rem;
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- صفوف الدوائر ---------- */
.row {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

/* ---------- الدوائر ---------- */
.guest {
  text-align: center;
  transition: 0.3s;
  width: 80px;
  height: 80px;
}
.guest img {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 3px solid #00f2ea;
  box-shadow: 0 0 18px #00f2ea;
}
.guest.empty {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px dashed #555;
  border-radius: 50%;
  font-size: 28px;
  color: #777;
  box-shadow: none;
}
.guest span {
  display: block;
  margin-top: 6px;
  font-size: 0.9rem;
  max-width: 90px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.guest:hover { transform: scale(1.15); }

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

/* ---------- طلبات القست ---------- */
.request-card {
  background: #111;
  padding: 12px;
  border-radius: 15px;
  margin-top: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.request-card img {
  width: 50px;
  height: 50px;
  border-radius: 50%;
}
.req-buttons button {
  margin-left: 5px;
  padding: 6px 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}
.accept { background: #00ff88; }
.reject { background: #ff4d4d; color: #fff; }

/* ---------- المصابيح الحية ---------- */
.party-lights {
  position: fixed;
  top: 25px;
  width: 100%;
  height: 150px;
  pointer-events: none;
  z-index: 1000;
}
.light-curve {
  position: absolute;
  top: 55px;
  width: 50%;
  display: flex;
  justify-content: space-around;
  transform-origin: top center;
}
.curve1 { left: 0; transform: rotate(-20deg); }
.curve2 { right: 0; transform: rotate(20deg); }
.light-curve::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: #444;
}
.bulb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  box-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
  animation: sparkle 1s infinite alternate, swing 3s infinite ease-in-out;
  background-color: var(--bulb-color, red);
  position: relative;
  top: 10px;
}
@keyframes swing {
  0% { transform: rotate(-15deg); }
  50% { transform: rotate(15deg); }
  100% { transform: rotate(-15deg); }
}
@keyframes sparkle {
  0% { opacity: 0.4; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.2); }
  100% { opacity: 0.4; transform: scale(0.8); }
}

/* ---------- البطاقات والنافذة ---------- */
.card {
  position: relative;
  width: 100%;
  max-width: 700px;
  height: 200px;
  border-radius: 20px;
  margin: 30px auto 0;
  overflow: hidden;
  background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSPnlybzTv_9UDA1DTBV-CKwatxUu-xwWAXhQ&s') center/cover no-repeat;
  box-shadow: 0 0 30px rgba(0,0,0,0.6);
}
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(12px);
  background: rgba(0,0,0,0.5);
}
.content {
  position: relative;
  color: white;
  padding: 20px;
  text-align: right;
}
.profile {
  position: absolute;
  top: 15px;
  left: 85%;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 3px solid white;
  object-fit: cover;
}
#username {
  position: absolute;
  top: 95px;
  left: 89%;
  font-size: 20px;
  opacity: 0.9;
}
#text {
  margin-top: 105px;
  font-size: 16px;
  line-height: 1.6;
}

/* ---------- تذييل الحقوق ---------- */
.MT {
  width: 100%;
  max-width: 900px;
  margin: 20px auto;
  text-align: center;
  padding: 8px;
  border-radius: 5px;
  background: #1725BF;
  color: #fff;
  font-weight: bold;
  box-shadow: 0 0 15px #B000FF;
}

/* ---------- استجابة ---------- */
@media(max-width: 900px){
  .main-guest img { width: 100px; height: 100px; }
  .guest img { width: 65px; height: 65px; }
  .host img { width: 50px; height: 50px; }
  .host-name { font-size: 1rem; }
}
@media(max-width: 600px){
  .main-guest img { width: 80px; height: 80px; }
  .guest img { width: 55px; height: 55px; }
  .host img { width: 40px; height: 40px; }
  .host-name { font-size: 0.95rem; }
}
</style>
</head>
<body>
<div class="party-lights">
  <div class="vip-box">ضيوف الشرف</div>
  <div class="light-curve curve1">
    <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
  </div>
  <div class="light-curve curve2">
    <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
  </div>
</div>

<div class="container">
  <div class="host">
    <img src="profile.jpeg">
    <div class="host-name">المضيف: M 🔥</div>
  </div>

  <div class="current-box-pro">
    <h3>🔥 القست الحالي</h3>
    <div class="guests-pro">
      <div class="main-guest">
        <img src="profile.jpeg">
        <div>M 🔥</div>
      </div>
      <div class="row" id="guestSlotsRow1"></div>
      <div class="row" id="guestSlotsRow2"></div>
    </div>
    <div class="timer" id="timer">00:00:00</div>
  </div>

  <div id="requests"></div>

  <div class="card">
    <div class="overlay"></div>
    <div class="content">
      <img src="profile.jpeg" class="profile">
      <div id="username">M</div>
      <p id="text">
        مرحباً بك في بث LIVE الخاص بي! تفاعل معي ومع المشاهدين الآخرين من خلال التعليق وإبداء رأيك. تابع حسابي إذا استمتعت بالفيديو اليوم.
      </p>
    </div>
  </div>
</div>

<div class="MT">جميع الحقوق محفوظة لدى محسن © 2025</div>

<script>
let slots = 8, acceptedGuests = [], requests = [];
let pendingGuests = [
  {name:"الجنوبي",img:"https://i.ibb.co/d0J8TQfF/Jn.png"},
  {name:"سكون",img:"https://i.ibb.co/HT3KKgwy/Skn.png"},
  {name:"~🇸🇦 mehsen",img:"https://i.ibb.co/dsjrRgpV/hsn.png"},
  {name:"هدليتسء",img:"https://b.top4top.io/p_374507np10.jpg"},
  {name:"سكون الروح",img:"https://i.ibb.co/VpJ41v4f/Skn-R.png"},
  {name:"R",img:"https://c.top4top.io/p_3745csx751.jpg"},
  {name:"صمت الرحيل",img:"https://i.ibb.co/8DW4t5Nb/smt.png"},
  {name:"مقعد الرشيدي",img:"https://i.ibb.co/MkLwkLGj/mq3d.png"}
];
let currentIndex = 0;

// إنشاء الخانات
function createSlots() {
  let row1 = document.getElementById("guestSlotsRow1");
  let row2 = document.getElementById("guestSlotsRow2");
  row1.innerHTML = ""; row2.innerHTML = "";
  for(let i=0;i<4;i++) row1.innerHTML += `<div class="guest empty" id="slot${i}"><div>+</div></div>`;
  for(let i=4;i<8;i++) row2.innerHTML += `<div class="guest empty" id="slot${i}"><div>+</div></div>`;
}
createSlots();

// عرض الطلبات
function renderRequests() {
  let box = document.getElementById("requests"); box.innerHTML="";
  requests.forEach((r,i)=>{
    box.innerHTML += `<div class="request-card">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="${r.img}"><div>${r.name}</div>
      </div>
      <div class="req-buttons">
        <button class="accept" onclick="acceptRequest(${i})">✔</button>
        <button class="reject" onclick="rejectRequest(${i})">✖</button>
      </div>
    </div>`;
  });
}

// إرسال الطلب التالي تدريجيًا
function showNextRequest() {
  if(currentIndex < pendingGuests.length){
    requests.push(pendingGuests[currentIndex]);
    currentIndex++; renderRequests();
  }
}
showNextRequest();
setInterval(showNextRequest,60000);

// قبول ورفض الطلب
function acceptRequest(i) {
  if(acceptedGuests.length<slots){
    let guest = requests[i]; acceptedGuests.push(guest);
    let slot = document.getElementById("slot"+(acceptedGuests.length-1));
    slot.classList.remove("empty");
    slot.innerHTML = `<img src="${guest.img}"><span>${guest.name}</span>`;
    requests.splice(i,1); renderRequests();
  }
}
function rejectRequest(i){ requests.splice(i,1); renderRequests(); }

// المؤقت
let time=0;
setInterval(()=>{
  time++;
  let h=String(Math.floor(time/3600)).padStart(2,'0');
  let m=String(Math.floor((time%3600)/60)).padStart(2,'0');
  let s=String(time%60).padStart(2,'0');
  document.getElementById("timer").innerText=`${h}:${m}:${s}`;
},1000);

// المصابيح
const bulbs=document.querySelectorAll('.bulb');
const colors=["#ff0000","#ff9900","#ffff00","#33ff00","#00ffff","#0033ff","#9900ff","#ff00ff"];
function randomColor(){ return colors[Math.floor(Math.random()*colors.length)]; }
function updateBulbs(){ bulbs.forEach(b=>b.style.setProperty('--bulb-color', randomColor())); }
setInterval(updateBulbs,500);
updateBulbs();

// النصوص
document.getElementById("username").textContent="M";
document.getElementById("text").textContent="مرحبا بك في بث LIVE الخاص بي تفاعل معي ومع المشاهدين الآخرين من خلال التعليق وإبداء رأيك. تابع حسابي إذا استمتعت بفيديو اليوم";
</script>
</body>
</html>
