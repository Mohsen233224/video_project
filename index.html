const tocList = document.getElementById('tocList');

  li.textContent = `الصفحة ${i+1}`;
  li.onclick = ()=>{currentPage=i; showPage(currentPage);}
  tocList.appendChild(li);
}

function showPage(index){
  pageContent.innerHTML = `<h2>${pages[index].title}</h2><p>${pages[index].text.replace(/\n/g,'<br>')}</p>`;
  progressBar.style.width = `${((index+1)/totalPages)*100}%`;
}

function prevPage(){if(currentPage>0) currentPage--; showPage(currentPage);}

// تحميل الصفحة الأولى عند فتح الموقع
showPage(currentPage);

// عرض وإخفاء نافذة المشاركة مع ترتيب الأزرار على شكل حلقة
const shareBtn = document.getElementById('shareBtn');
const sharePopup = document.getElementById('sharePopup');

shareBtn.addEventListener('click', () => {
  if(sharePopup.style.display==='flex'){
    sharePopup.style.display='none';
  } else {
    sharePopup.style.display='flex';
    arrangeCircle();
  }
});

// ترتيب الأيقونات في حلقة
function arrangeCircle(){
  const icons = sharePopup.querySelectorAll('.social-icon');
  const radius = 80;
  const centerX = 100;
  const centerY = 100;
  const total = icons.length;

  const pageUrl = encodeURIComponent(window.location.href);
  const pageTitle = encodeURIComponent("بالنيابة عنهم - الكتاب الرقمي");
  const shareText = encodeURIComponent(`شاهد هذا الكتاب الرقمي: ${decodeURIComponent(pageTitle)}`);

  icons.forEach((icon,index)=>{
    const angle = (index/total)*2*Math.PI;
    const x = centerX + radius*Math.cos(angle) - 20;
    const y = centerY + radius*Math.sin(angle) - 20;
    icon.style.left = `${x}px`;
    icon.style.top = `${y}px`;

    // تعيين روابط المشاركة
    if(icon.classList.contains('whatsapp')){
      icon.href = `https://api.whatsapp.com/send?text=${shareText}%20${pageUrl}`;
    } else if(icon.classList.contains('facebook')){
      icon.href = `https://www.facebook.com/sharer/sharer.php?u=${pageUrl}&quote=${shareText}`;
    } else if(icon.classList.contains('twitter')){
      icon.href = `https://twitter.com/intent/tweet?text=${shareText}&url=${pageUrl}`;
    } else if(icon.classList.contains('telegram')){
      icon.href = `https://t.me/share/url?url=${pageUrl}&text=${shareText}`;
    } else if(icon.classList.contains('linkedin')){
      icon.href = `https://www.linkedin.com/sharing/share-offsite/?url=${pageUrl}`;
    } else if(icon.classList.contains('email')){
      icon.href = `mailto:?subject=${encodeURIComponent("مشاركة كتاب رقمي")}&body=${shareText}%20${pageUrl}`;
    }
  });
}
</script>
