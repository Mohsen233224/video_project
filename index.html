<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المعرض الخاص</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<style>

/* ===== الأساسيات ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:radial-gradient(circle at top,#1b1b1b,#070707);
color:#fff;
min-height:100vh;
}

/* ===== الهيدر ===== */
header{
padding:20px;
text-align:center;
font-size:26px;
font-weight:800;
background:rgba(255,255,255,.05);
backdrop-filter:blur(10px);
}

/* ===== التبويبات ===== */
.box03D{
display:flex;
justify-content:center;
margin:20px;
gap:10px;
}

.tab-btn{
padding:10px 20px;
border:none;
border-radius:30px;
background:#1c1c1c;
color:#aaa;
cursor:pointer;
transition:.3s;
}

.tab-btn.active{
background:linear-gradient(135deg,#ff0050,#ff9900);
color:#fff;
}

/* ===== المعرض ===== */
.container{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:20px;
}

.card{
background:#111;
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img,
.card video{
width:100%;
height:200px;
object-fit:cover;
}

/* ===== أزرار ===== */
.actions{
display:flex;
justify-content:space-between;
padding:10px;
}

.actions button{
border:none;
background:#222;
color:#fff;
padding:6px 12px;
border-radius:20px;
cursor:pointer;
}

/* ===== viewer ===== */
.viewer{
position:fixed;
inset:0;
background:#000;
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.viewer.active{
display:flex;
}

.viewer img,
.viewer video{
max-width:95%;
max-height:95%;
}

.close-view{
position:absolute;
top:20px;
right:25px;
font-size:35px;
cursor:pointer;
z-index:1001;
background:rgba(0,0,0,.5);
padding:5px 12px;
border-radius:10px;
}

/* ===== أزرار عائمة ===== */
.add-btn{
position:fixed;
bottom:100px;
left:25px;
width:65px;
height:65px;
border-radius:50%;
background:linear-gradient(135deg,#ff0050,#ff9900);
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
color:#fff;
text-decoration:none;
}

.delete-section-btn{
position:fixed;
bottom:25px;
left:25px;
width:55px;
height:55px;
border-radius:50%;
background:linear-gradient(135deg,#ff0000,#990000);
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
color:#fff;
text-decoration:none;
}

/* ===== popup ===== */
.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:none;
align-items:center;
justify-content:center;
}

.popup.active{
display:flex;
}

.popup-content{
background:#1a1a1a;
padding:20px;
border-radius:15px;
width:90%;
max-width:350px;
text-align:center;
}

.popup-content input,
.popup-content select{
width:100%;
margin:8px 0;
padding:10px;
background:#222;
border:none;
color:#fff;
border-radius:8px;
}

.popup-content button{
margin-top:8px;
padding:10px;
border:none;
border-radius:20px;
color:#fff;
cursor:pointer;
}

.send{background:#ff0050;}
.choose{background:#00ccff;}
.close{background:#555;}

.empty{
text-align:center;
opacity:.6;
grid-column:1/-1;
}

</style>
</head>

<body>

<header>✨ المعرض الخاص</header>

<div class="box03D">
<button class="tab-btn active" onclick="changeSection('محسن الشريف',this)">محسن الشريف</button>
<button class="tab-btn" onclick="changeSection('سلطان الأحمري',this)">سلطان الأحمري</button>
<button class="tab-btn" onclick="changeSection('مقعد الرشيدي',this)">مقعد الرشيدي</button>
</div>

<div class="container" id="mediaContainer"></div>

<!-- viewer -->
<div class="viewer" id="viewer">
<span class="close-view" onclick="closeViewer()">✕</span>
<div id="viewerContent"></div>
</div>

<a class="add-btn" onclick="openPopup()">＋</a>
<a class="delete-section-btn" onclick="askDeleteSection()">🗑</a>

<!-- popup -->
<div class="popup" id="popup">
<div class="popup-content">

<h3>إضافة محتوى</h3>

<select id="sectionSelect">
<option>محسن الشريف</option>
<option>سلطان الأحمري</option>
<option>مقعد الرشيدي</option>
</select>

<input type="text" id="urlInput" placeholder="رابط صورة أو فيديو">
<input type="file" id="fileInput" hidden multiple accept="image/*,video/*">

<button class="choose" onclick="pickFiles()">📁 اختيار ملفات</button>
<button class="send" onclick="sendContent()">🚀 إرسال</button>
<button class="close" onclick="closePopup()">إلغاء</button>

</div>
</div>

<script>

/* ===== التخزين ===== */
function ensureFolders(){
let data=localStorage.getItem("folders");
if(!data){
let folders={
"محسن الشريف":[],
"سلطان الأحمري":[],
"مقعد الرشيدي":[]
};
localStorage.setItem("folders",JSON.stringify(folders));
return folders;
}
return JSON.parse(data);
}

function getData(){return ensureFolders();}

function saveData(d){
localStorage.setItem("folders",JSON.stringify(d));
}

/* ===== القسم ===== */
let currentSection="محسن الشريف";
let container=document.getElementById("mediaContainer");

/* ===== تغيير القسم ===== */
function changeSection(name,btn){
currentSection=name;
document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
loadMedia();
}

/* ===== تحميل ===== */
function loadMedia(){
container.innerHTML="";
let items=getData()[currentSection];

if(!items.length){
container.innerHTML="<div class='empty'>لا يوجد محتوى</div>";
return;
}

items.forEach((item,i)=>{
let card=document.createElement("div");
card.className="card";

card.innerHTML=
(item.type==="video"
? `<video src="${item.url}" muted loop autoplay playsinline></video>`
: `<img src="${item.url}">`)
+
`<div class="actions">
<button onclick="event.stopPropagation();like(${i})">❤️ ${item.likes}</button>
<button onclick="event.stopPropagation();removeItem(${i})">🗑</button>
</div>`;

card.onclick=()=>openViewer(item);
container.appendChild(card);
});
}

/* ===== لايك ===== */
function like(i){
let d=getData();
d[currentSection][i].likes++;
saveData(d);
loadMedia();
}

/* ===== حذف ===== */
function removeItem(i){
let d=getData();
d[currentSection].splice(i,1);
saveData(d);
loadMedia();
}

/* ===== viewer ===== */
function openViewer(item){
let viewer=document.getElementById("viewer");
let content=document.getElementById("viewerContent");

content.innerHTML =
item.type==="video"
? `<video src="${item.url}" controls autoplay></video>`
: `<img src="${item.url}">`;

viewer.classList.add("active");
}

function closeViewer(){
let viewer=document.getElementById("viewer");
let v=viewer.querySelector("video");
if(v){v.pause();}
viewer.classList.remove("active");
}

/* ===== popup ===== */
let selectedFiles=[];

function openPopup(){
document.getElementById("popup").classList.add("active");
}

function closePopup(){
document.getElementById("popup").classList.remove("active");
selectedFiles=[];
}

function pickFiles(){
document.getElementById("fileInput").click();
}

document.getElementById("fileInput").onchange=e=>{
selectedFiles=[...e.target.files];
};

/* ===== إرسال ===== */
function sendContent(){

let url=document.getElementById("urlInput").value.trim();
let section=document.getElementById("sectionSelect").value;
let folders=getData();

if(url){
let type=url.match(/\.(mp4|webm|ogg)$/i)?"video":"image";
folders[section].push({type,url,likes:0});
saveData(folders);
closePopup();
loadMedia();
return;
}

if(!selectedFiles.length) return alert("اختر ملفات");

selectedFiles.forEach(file=>{

let fileURL = URL.createObjectURL(file);

folders[section].push({
type:file.type.startsWith("video")?"video":"image",
url:fileURL,
likes:0
});

});

saveData(folders);
closePopup();
loadMedia();
}

/* ===== كلمات المرور ===== */
const sectionPasswords={
"محسن الشريف":"1111",
"سلطان الأحمري":"2222",
"مقعد الرشيدي":"3333"
};

function askDeleteSection(){

let pass=prompt("كلمة مرور حذف قسم "+currentSection);

if(pass===sectionPasswords[currentSection]){
if(confirm("سيتم حذف كل محتوى القسم!")){
let data=getData();
data[currentSection]=[];
saveData(data);
loadMedia();
alert("تم الحذف ✅");
}
}else{
alert("كلمة المرور خاطئة ❌");
}
}

loadMedia();

</script>
</body>
</html>
