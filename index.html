<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إضافة محتوى</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:#fff;
  text-align:center;
}

.container{
  margin-top:60px;
}

select,input,button{
  padding:12px;
  margin:10px;
  border-radius:8px;
  border:none;
  font-size:16px;
}

button{
  background:#ff0050;
  color:white;
  cursor:pointer;
}

button:hover{
  opacity:0.8;
}

.link{
  color:#00f2ff;
  text-decoration:none;
  font-size:18px;
}
</style>
</head>
<body>

<div class="container">
  <h2>إضافة فيديو أو صورة</h2>

  <select id="type">
    <option value="image">صورة</option>
    <option value="video">فيديو</option>
  </select>

  <br>

  <input type="file" id="fileInput" accept="image/*,video/*">

  <br>

  <button onclick="saveMedia()">إضافة</button>

  <br><br>

  <a href="video.html" class="link">الانتقال لصفحة العرض →</a>
</div>

<script>
function saveMedia() {
  const fileInput = document.getElementById("fileInput");
  const type = document.getElementById("type").value;
  const file = fileInput.files[0];

  if (!file) {
    alert("اختر ملف أولاً");
    return;
  }

  const reader = new FileReader();
  reader.onload = function() {

    const media = {
      id: Date.now(),
      type: type,
      src: reader.result,
      likes: 0
    };

    let data = JSON.parse(localStorage.getItem("media")) || [];
    data.push(media);
    localStorage.setItem("media", JSON.stringify(data));

    alert("تمت الإضافة ✅");
    fileInput.value = "";
  };

  reader.readAsDataURL(file);
}
</script>

</body>
</html>
