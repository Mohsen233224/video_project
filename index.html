<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎤 إدارة القستات PRO MAX</title>
<style>
/* ==========================
   Reset & Base
========================== */
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Segoe UI',sans-serif;
  background: radial-gradient(circle at top,#0f2027,#000);
  color:#fff;
  display:flex;
  justify-content:center;
  padding:0;
  min-height:100vh;
}

/* ==========================
   Container
========================== */
.container{
  width:95%;
  max-width:1200px;
  margin:auto;
  text-align:center;
}

/* ==========================
   المضيف
========================== */
.host{
  display:flex;
  align-items:center;
  gap:1rem;
  justify-content:center;
  margin-bottom:1.5rem;
}
.host img{
  width:5rem;
  height:5rem;
  border-radius:50%;
  border:3px solid #00f2ea;
  box-shadow:0 0 20px #00f2ea;
  object-fit:cover;
}
.host-name{
  font-weight:bold;
  font-size:1.2rem;
  color:#00f2ea;
}

/* ==========================
   القست الحالي
========================== */
.current-box-pro{
  padding:1.5rem;
  border-radius:25px;
  background:#0b0b0b;
  position:relative;
  margin-bottom:2rem;
  overflow:hidden;
  box-shadow:0 0 25px rgba(0,255,255,0.2);
}
.current-box-pro::before{
  content:"";
  position:absolute;
  inset:0;
  padding:3px;
  border-radius:25px;
  background:linear-gradient(45deg,#00f2ea,#ff00c8,#00ff88,#ffaa00);
  background-size:300% 300%;
  animation:borderMove 6s linear infinite;
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
}
@keyframes borderMove{
  0%{background-position:0%}
  100%{background-position:300%}
}

/* ==========================
   الوقت
========================== */
.timer{
  text-align:center;
  font-size:1.3rem;
  color:#00ff88;
  margin-top:1rem;
}

/* ==========================
   الضيوف
========================== */
.guests-pro{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1.5rem;
}
.main-guest{
  text-align:center;
  animation:pulse 2s infinite;
}
.main-guest img{
  width:10rem;
  height:10rem;
  border-radius:50%;
  border:5px solid #ffaa00;
  box-shadow:0 0 35px #ffaa00;
  object-fit:cover;
}
.main-guest div{
  margin-top:.75rem;
  color:#ffaa00;
  font-weight:bold;
  font-size:1.1rem;
  max-width:180px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* صفوف الدوائر */
.row{
  display:flex;
  justify-content:center;
  gap:1.25rem;
  margin-top:1.25rem;
  flex-wrap:wrap;
}
.guest{
  text-align:center;
  transition:.3s;
  width:5rem;
  height:5rem;
  position:relative;
}
.guest img{
  width:100%;
  height:100%;
  border-radius:50%;
  border:3px solid #00f2ea;
  box-shadow:0 0 18px #00f2ea;
  object-fit:cover;
}
.guest.empty{
  display:flex;
  align-items:center;
  justify-content:center;
  border:3px dashed #555;
  border-radius:50%;
  font-size:1.5rem;
  color:#777;
  box-shadow:none;
}
.guest span{
  display:block;
  margin-top:0.25rem;
  font-size:0.9rem;
  max-width:5rem;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.guest:hover{transform:scale(1.15);}

/* ==========================
   نبض
========================== */
@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

/* ==========================
   طلبات القست
========================== */
.request-card{
  background:#111;
  padding:.75rem;
  border-radius:15px;
  margin-top:.75rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.request-card img{
  width:3rem;
  height:3rem;
  border-radius:50%;
  object-fit:cover;
}
.req-buttons button{
  margin-left:.3rem;
  padding:.3rem .75rem;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}
.accept{background:#00ff88;}
.reject{background:#ff4d4d;color:#fff;}

/* ==========================
   الشاشات الصغيرة
========================== */
@media(max-width:900px){
  .main-guest img{width:8rem;height:8rem;}
  .guest img{width:4.25rem;height:4.25rem;}
  .host img{width:4rem;height:4rem;}
  .host-name{font-size:1rem;}
}
@media(max-width:600px){
  .main-guest img{width:6rem;height:6rem;}
  .guest img{width:3rem;height:3rem;}
  .host img{width:2.5rem;height:2.5rem;}
  .host-name{font-size:.95rem;}
}

/* ==========================
   بطاقة الترحيب
========================== */
.card{
  position: relative;
  width:100%;
  max-width:700px;
  height:auto;
  border-radius:20px;
  margin:2% auto;
  overflow:hidden;
  background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSPnlybzTv_9UDA1DTBV-CKwatxUu-xwWAXhQ&s') center/cover no-repeat;
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
}
.overlay{
  position:absolute;
  width:100%;
  height:100%;
  backdrop-filter: blur(12px);
  background: rgba(0,0,0,0.5);
}
.content{
  position:relative;
  color:white;
  padding:1.25rem;
  text-align:right;
}
.profile{
  position:absolute;
  top:1rem;
  left:80%;
  width:4.5rem;
  height:4.5rem;
  border-radius:50%;
  border:3px solid white;
  object-fit:cover;
}
#username{
  position:absolute;
  top:5rem;
  left:78%;
  font-size:1.75rem;
  opacity:0.9;
}
#text{
  margin-top:6rem;
  font-size:1rem;
  line-height:1.6;
}

/* ==========================
   شريط الحقوق
========================== */
.MT{
  width:90%;
  max-width:1200px;
  height:2.2rem;
  position:fixed;
  bottom:3px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  border-radius:5px;
  background:#1725BF;
  color:#fff;
  line-height:2.2rem;
  font-weight:bold;
  cursor:pointer;
  box-shadow: #B000FF 0 0 35px;
  transition:all 0.3s ease;
}
.MT:hover{background:#1A33E0; box-shadow:#B000FF 0 0 25px;}

/* ==========================
   المصابيح
========================== */
.party-lights{position:fixed;top:25px;width:100%;height:150px;pointer-events:none;z-index:1000;}
.light-curve{position:absolute;top:55px;width:50%;display:flex;justify-content:space-around;transform-origin:top center;}
.curve1{left:0;transform:rotate(-20deg);}
.curve2{right:0;transform:rotate(20deg);}
.light-curve::before{
  content:'';
  position:absolute;
  top:0;left:0;
  width:100%;
  height:4px;
  border-radius:2px;
  background:#444;
}
.bulb{
  width:20px;height:20px;
  border-radius:50%;
  background-color:var(--bulb-color, red);
  box-shadow:0 0 10px currentColor,0 0 20px currentColor;
  animation:sparkle 1s infinite alternate,swing 3s infinite ease-in-out;
  position:relative;
  top:10px;
}
@keyframes swing{
  0%{transform:rotate(-15deg);}
  50%{transform:rotate(15deg);}
  100%{transform:rotate(-15deg);}
}
@keyframes sparkle{
  0%{opacity:0.4;transform:scale(0.8);}
  50%{opacity:1;transform:scale(1.2);}
  100%{opacity:0.4;transform:scale(0.8);}
}
</style>
</head>
<body>

<div class="party-lights">
  <div class="vip-box">ضيوف الشرف</div>
  <div class="light-curve curve1">
    <div class="bulb" style="--i:0;"></div>
    <div class="bulb" style="--i:1;"></div>
    <div class="bulb" style="--i:2;"></div>
    <div class="bulb" style="--i:3;"></div>
    <div class="bulb" style="--i:4;"></div>
  </div>
  <div class="light-curve curve2">
    <div class="bulb" style="--i:0;"></div>
    <div class="bulb" style="--i:1;"></div>
    <div class="bulb" style="--i:2;"></div>
    <div class="bulb" style="--i:3;"></div>
    <div class="bulb" style="--i:4;"></div>
  </div>
</div>

<div class="container">

  <div class="host">
    <img src="profile.jpeg">
    <div class="host-name">المضيف: M 🔥</div>
  </div>

  <div class="current-box-pro">
    <h3>🔥 القست الحالي</h3>
    <div class="guests-pro">
      <div class="main-guest">
        <img src="profile.jpeg">
        <div>M 🔥</div>
      </div>
      <div class="row" id="guestSlotsRow1"></div>
      <div class="row" id="guestSlotsRow2"></div>
    </div>
    <div class="timer" id="timer">00:00:00</div>
  </div>

  <div id="requests"></div>

  <div class="card">
    <div class="overlay"></div>
    <div class="content">
      <img src="profile.jpeg" alt="profile" class="profile">
      <div id="username">M</div>
      <p id="text">
        مرحباً بك في بث LIVE الخاص بي! تفاعل معي ومع المشاهدين الآخرين.
      </p>
    </div>
  </div>
</div>

<div class="MT">جميع الحقوق محفوظه لدى محسن© 2025</div>

<script>
// ======= المتغيرات =======
let slots = 8; 
let acceptedGuests = []; 
let requests = []; 
let pendingGuests = [
  {name:"الجنوبي",img:"https://i.ibb.co/d0J8TQfF/Jn.png"},
  {name:"سكون",img:"https://i.ibb.co/HT3KKgwy/Skn.png"},
  {name:"~🇸🇦 mehsen",img:"https://i.ibb.co/dsjrRgpV/hsn.png"},
  {name:"هدليتسء",img:"https://b.top4top.io/p_374507np10.jpg"},
  {name:"سكون الروح",img:"https://i.ibb.co/VpJ41v4f/Skn-R.png"},
  {name:"R",img:"https://c.top4top.io/p_3745csx751.jpg"},
  {name:"صمت الرحيل",img:"https://i.ibb.co/8DW4t5Nb/smt.png"},
  {name:"مقعد الرشيدي",img:"https://i.ibb.co/MkLwkLGj/mq3d.png"}
];
let currentIndex = 0; 

// ======= إنشاء الخانات =======
function createSlots() {
  let row1 = document.getElementById("guestSlotsRow1");
  let row2 = document.getElementById("guestSlotsRow2");
  row1.innerHTML = "";
  row2.innerHTML = "";
  for (let i = 0; i < 4; i++){
    row1.innerHTML += `<div class="guest empty" id="slot${i}"><div>+</div></div>`;
  }
  for (let i = 4; i < 8; i++){
    row2.innerHTML += `<div class="guest empty" id="slot${i}"><div>+</div></div>`;
  }
}
createSlots();

// ======= عرض الطلبات =======
function renderRequests(){
  let box = document.getElementById("requests");
  box.innerHTML="";
  requests.forEach((r,i)=>{
    box.innerHTML += `<div class="request-card">
      <div style="display:flex;align-items:center;gap:.5rem;">
        <img src="${r.img}">
        <div>${r.name}</div>
      </div>
      <div class="req-buttons">
        <button class="accept" onclick="acceptRequest(${i})">✔</button>
        <button class="reject" onclick="rejectRequest(${i})">✖</button>
      </div>
    </div>`;
  });
}

// ======= إرسال الطلب التالي تدريجيًا =======
function showNextRequest(){
  if(currentIndex < pendingGuests.length){
    requests.push(pendingGuests[currentIndex]);
    currentIndex++;
    renderRequests();
  }
}
showNextRequest();
setInterval(showNextRequest,60000);

// ======= قبول الطلب =======
function acceptRequest(i){
  if(acceptedGuests.length<slots){
    let guest=requests[i];
    acceptedGuests.push(guest);
    let slot=document.getElementById("slot"+(acceptedGuests.length-1));
    slot.classList.remove("empty");
    slot.innerHTML=`<img src="${guest.img}"><span>${guest.name}</span>`;
    requests.splice(i,1);
    renderRequests();
  }
}

// ======= رفض الطلب =======
function rejectRequest(i){requests.splice(i,1);renderRequests();}

// ======= المؤقت =======
let time=0;
function startTimer(){
  setInterval(()=>{
    time++;
    let h=String(Math.floor(time/3600)).padStart(2,'0');
    let m=String(Math.floor((time%3600)/60)).padStart(2,'0');
    let s=String(time%60).padStart(2,'0');
    document.getElementById("timer").innerText=`${h}:${m}:${s}`;
  },1000);
}
startTimer();

// ======= المصابيح =======
const bulbs=document.querySelectorAll('.bulb');
const colors=["#ff0000","#ff9900","#ffff00","#33ff00","#00ffff","#0033ff","#9900ff","#ff00ff"];
function randomColor(){return colors[Math.floor(Math.random()*colors.length)];}
function updateBulbs(){
  bulbs.forEach(bulb=>{
    if(Math.random()<0.2){
      const other=bulbs[Math.floor(Math.random()*bulbs.length)];
      bulb.style.setProperty('--bulb-color',other.style.getPropertyValue('--bulb-color')||randomColor());
    }else{bulb.style.setProperty('--bulb-color',randomColor());}
  });
}
setInterval(updateBulbs,500);
updateBulbs();
</script>
</body>
</html>
