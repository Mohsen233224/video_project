<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جولة الجنوبي الفخمة</title>

<style>
* {
  box-sizing: border-box;
}

body, html {
  margin:0;
  padding:0;
  height:100%;
  font-family:'Arial Black', Arial, sans-serif;
}

/* الخلفية */
body {
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(180deg, rgba(0,0,0,0.8), rgba(20,0,40,0.9)), url('root.jpg') no-repeat center center;
  background-size: cover;
  position: relative;
  overflow:hidden;
}

/* كرت الجولة */
.card {
  position:relative;
  z-index:2;
  width:90%;
  max-width:420px;
  padding:30px;
  border-radius:25px;
  text-align:center;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(15px);
  box-shadow:0 0 40px #ff00aa, 0 0 80px #ff00aa inset;
  color:#fff;
  animation: glow 2s infinite alternate;
}

/* حركة خفيفة للكرت */
@keyframes glow {
  0% { box-shadow:0 0 40px #ff00aa, 0 0 80px #ff00aa inset; }
  100% { box-shadow:0 0 60px #ff2fd3, 0 0 100px #ff2fd3 inset; }
}

/* الاسم */
.name {
  font-size:7vw;
  font-weight:bold;
  color: #ff2fd3;
  margin-bottom:15px;
  text-shadow: 0 0 10px #ff2fd3, 0 0 20px #ff00aa;
}

/* المؤقت */
.timer {
  font-size:9vw;
  margin:20px 0;
  color:#00ffe1;
  text-shadow: 0 0 10px #00ffe1, 0 0 20px #00fff0;
  animation: timerGlow 2s infinite alternate;
}

@keyframes timerGlow {
  0% { color:#00ffe1; text-shadow:0 0 10px #00ffe1,0 0 20px #00fff0; }
  100% { color:#00fff0; text-shadow:0 0 20px #00fff0,0 0 30px #00ffff; }
}

/* الجوالات */
.points {
  font-size:7vw;
  color:#00ffcc;
  margin-bottom:15px;
  transition:0.2s;
  text-shadow:0 0 10px #00ffcc,0 0 20px #00ffaa;
}

.flash {
  transform:scale(1.3);
  color:#fff;
  text-shadow:0 0 15px #fff,0 0 30px #00ffcc;
}

/* زر */
button {
  padding:14px 25px;
  border:none;
  border-radius:15px;
  background: linear-gradient(45deg,#ff00aa,#ff2fd3);
  color:#fff;
  font-size:5vw;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 15px #ff00aa,0 0 30px #ff2fd3 inset;
}

button:hover {
  transform:scale(1.1);
  box-shadow:0 0 25px #ff00aa,0 0 50px #ff2fd3 inset;
}

/* Media Queries للآيباد والجوال */
@media (min-width:768px) {
  .name { font-size:32px; }
  .timer { font-size:40px; }
  .points { font-size:28px; }
  button { font-size:18px; padding:12px 30px; }
}

@media (min-width:1200px) {
  .name { font-size:40px; }
  .timer { font-size:50px; }
  .points { font-size:32px; }
  button { font-size:20px; padding:15px 35px; }
}
</style>
</head>

<body>

<div class="card">
  <div class="name">🔥 الجنوبي 🔥</div>

  <div class="timer" id="timer">00:00</div>

  <div class="points">📱 <span id="points">0</span></div>

  <button onclick="toggle()">تشغيل / إيقاف</button>
</div>

<script>
let seconds = 0;
let timer;
let running = false;
let points = 0;
let fake;

// تحديث الوقت
function updateTimer(){
  let m = Math.floor(seconds/60);
  let s = seconds % 60;
  document.getElementById("timer").innerText =
    (m<10?"0"+m:m)+":"+(s<10?"0"+s:s);
}

// تشغيل الجولة
function start(){
  timer = setInterval(()=>{
    seconds++;
    updateTimer();
  },1000);

  fake = setInterval(()=>{
    let random = Math.floor(Math.random()*6)+1;
    if(Math.random() > 0.8) random += Math.floor(Math.random()*25);
    points += random;

    let el = document.getElementById("points");
    el.innerText = points;

    el.classList.add("flash");
    setTimeout(()=>el.classList.remove("flash"),200);
  },700);
}

// إيقاف الجولة
function stop(){
  clearInterval(timer);
  clearInterval(fake);
}

// زر التشغيل/الإيقاف
function toggle(){
  if(!running){
    start();
    running = true;
  } else {
    stop();
    running = false;
  }
}
</script>

</body>
</html>
